server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location /control/ { proxy_pass http://tradeedge-control:8081/; proxy_http_version 1.1; proxy_set_header Host $host; }
  location /shadow/ { proxy_pass http://tradeedge-shadow:8080/; proxy_http_version 1.1; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
