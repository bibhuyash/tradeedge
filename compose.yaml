services:
  tradeedge-console:
    build:
      context: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - tradeedge-control
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  tradeedge-control:
    build:
      context: .
      dockerfile: cmd/tradeedge-control/Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./.cache/tradeedge/session
        target: /var/lib/tradeedge/session
      - type: bind
        source: ./.cache
        target: /workspace/.cache
    environment:
      TRADEEDGE_CONTROL_HTTP_ADDR: :8081
      TRADEEDGE_SHUTDOWN_TIMEOUT: ${TRADEEDGE_SHUTDOWN_TIMEOUT:-10s}
      TRADEEDGE_ZERODHA_SESSION_FILE: /var/lib/tradeedge/session/zerodha.json
      TRADEEDGE_REPOSITORY: /workspace
      TRADEEDGE_VALIDATION_COMMAND: /usr/local/bin/tradeedge-validation
      TRADEEDGE_SHADOW_READINESS_URL: http://tradeedge-shadow:8080/readyz
      TRADEEDGE_HOST_REPOSITORY: ${PWD}
      TRADEEDGE_ZERODHA_API_KEY: ${TRADEEDGE_ZERODHA_API_KEY:?required}
      TRADEEDGE_ZERODHA_API_SECRET: ${TRADEEDGE_ZERODHA_API_SECRET:?required}
      TRADEEDGE_ZERODHA_BASE_URL: ${TRADEEDGE_ZERODHA_BASE_URL:-https://api.kite.trade}
      TRADEEDGE_ZERODHA_TIMEOUT: ${TRADEEDGE_ZERODHA_TIMEOUT:-2s}
      TRADEEDGE_ZERODHA_MAX_CONCURRENCY: "1"
      TRADEEDGE_ZERODHA_READ_RETRIES: "0"
      TRADEEDGE_ZERODHA_MAPPING_MAX_AGE: ${TRADEEDGE_ZERODHA_MAPPING_MAX_AGE:-24h}
      TRADEEDGE_ZERODHA_READ_ONLY: "true"
      TRADEEDGE_TELEGRAM_BOT_TOKEN: ${TRADEEDGE_TELEGRAM_BOT_TOKEN:?required}
      TRADEEDGE_TELEGRAM_CHAT_ID: ${TRADEEDGE_TELEGRAM_CHAT_ID:?required}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  tradeedge-prepare:
    image: golang:1.23.4-bookworm@sha256:95db116434e3f21a2a15600ffc7169bf380c6bfd021b154d106fcb346721c277
    platform: linux/amd64
    init: true
    restart: "no"
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -eu
        git config --global --add safe.directory /workspace
        git config --global core.autocrlf true
        go build -buildvcs=true -o /tmp/tradeedge-validation ./cmd/tradeedge-validation
        go build -buildvcs=true -o /tmp/tradeedge-prepare ./cmd/tradeedge-prepare
        acceptance_flag=""
        if [ "$${TRADEEDGE_PREPARATION_ACCEPTANCE_ONLY:-false}" = "true" ]; then acceptance_flag="-acceptance-only"; fi
        exec /tmp/tradeedge-prepare $$acceptance_flag -repo /workspace -credentials-file /workspace/.env -selectors-file /workspace/.cache/tradeedge/preparation.env -session-file /var/lib/tradeedge/session/zerodha.json -validation-command /tmp/tradeedge-validation
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./.cache
        target: /workspace/.cache
      - type: bind
        source: ./.env
        target: /workspace/.env
      - type: bind
        source: ./.cache/tradeedge/session
        target: /var/lib/tradeedge/session
        read_only: true
    environment:
      TRADEEDGE_ZERODHA_BASE_URL: ${TRADEEDGE_ZERODHA_BASE_URL:-https://api.kite.trade}
      TRADEEDGE_ZERODHA_API_KEY: ${TRADEEDGE_ZERODHA_API_KEY:?required}
      TRADEEDGE_ZERODHA_TIMEOUT: ${TRADEEDGE_ZERODHA_TIMEOUT:-2s}
      TRADEEDGE_ZERODHA_MAX_CONCURRENCY: ${TRADEEDGE_ZERODHA_MAX_CONCURRENCY:-4}
      TRADEEDGE_ZERODHA_READ_RETRIES: ${TRADEEDGE_ZERODHA_READ_RETRIES:-2}
      TRADEEDGE_ZERODHA_MAPPING_MAX_AGE: ${TRADEEDGE_ZERODHA_MAPPING_MAX_AGE:-24h}
      TRADEEDGE_ZERODHA_READ_ONLY: "true"
      TRADEEDGE_PREPARATION_ACCEPTANCE_ONLY: "false"
      TRADEEDGE_TELEGRAM_BOT_TOKEN: ${TRADEEDGE_TELEGRAM_BOT_TOKEN:?required}
      TRADEEDGE_TELEGRAM_CHAT_ID: ${TRADEEDGE_TELEGRAM_CHAT_ID:?required}
      TRADEEDGE_AUTHORIZATION_MANIFEST_HOST: ${TRADEEDGE_AUTHORIZATION_MANIFEST_HOST:-}
      TRADEEDGE_RUNTIME_BUNDLE_HOST: ${TRADEEDGE_RUNTIME_BUNDLE_HOST:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  tradeedge-day0:
    image: golang:1.23.4-bookworm@sha256:95db116434e3f21a2a15600ffc7169bf380c6bfd021b154d106fcb346721c277
    platform: linux/amd64
    init: true
    restart: "no"
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -eu
        install -d -m 0700 /run/tradeedge
        if [ -z "$${TRADEEDGE_ZERODHA_REQUEST_TOKEN:-}" ] && { [ -z "$${TRADEEDGE_ZERODHA_ACCESS_TOKEN:-}" ] || [ -z "$${TRADEEDGE_ZERODHA_ACCESS_TOKEN_EXPIRES_AT:-}" ]; }; then
          echo "zerodha runtime credential is unavailable" >&2
          exit 1
        fi
        if [ -z "$${TRADEEDGE_AUTHORIZATION_MANIFEST:-}" ]; then
          echo "checksum-bound authorization manifest is unavailable; run tradeedge-prepare" >&2
          exit 1
        fi
        if [ "$${TRADEEDGE_ZERODHA_MODE:-}" = "SHADOW" ] && [ -z "$${TRADEEDGE_RUNTIME_BUNDLE:-}" ]; then
          echo "checksum-bound SHADOW runtime bundle is unavailable; run tradeedge-prepare" >&2
          exit 1
        fi
        go build -buildvcs=true -o /tmp/tradeedge ./cmd/tradeedge
        exec /tmp/tradeedge
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./.cache/market-validation/runtime-checkpoint
        target: /var/lib/tradeedge/checkpoint
      - type: tmpfs
        target: /run/tradeedge
        tmpfs:
          mode: 448
    environment:
      TRADEEDGE_ENV: production
      TRADEEDGE_HTTP_ADDR: :8080
      TRADEEDGE_TRADING_MODE: paper
      TRADEEDGE_ZERODHA_MODE: PAPER
      TRADEEDGE_ZERODHA_READ_ONLY: "true"
      TRADEEDGE_RUNTIME_BUNDLE: /workspace/.cache/market-validation/config/runtime-bundle.json
      TRADEEDGE_AUTHORIZATION_MANIFEST: ${TRADEEDGE_AUTHORIZATION_MANIFEST_HOST:-}
      TRADEEDGE_CHECKPOINT_ROOT: /var/lib/tradeedge/checkpoint
      TRADEEDGE_OPERATOR_CONTROL_SOCKET: /run/tradeedge/operator.sock
      TRADEEDGE_ZERODHA_API_KEY: ${TRADEEDGE_ZERODHA_API_KEY:?required}
      TRADEEDGE_ZERODHA_API_SECRET: ${TRADEEDGE_ZERODHA_API_SECRET:?required}
      TRADEEDGE_ZERODHA_REQUEST_TOKEN: ${TRADEEDGE_ZERODHA_REQUEST_TOKEN:-}
      TRADEEDGE_ZERODHA_ACCESS_TOKEN: ${TRADEEDGE_ZERODHA_ACCESS_TOKEN:-}
      TRADEEDGE_ZERODHA_ACCESS_TOKEN_EXPIRES_AT: ${TRADEEDGE_ZERODHA_ACCESS_TOKEN_EXPIRES_AT:-}
      TRADEEDGE_TELEGRAM_ENABLED: "true"
      TRADEEDGE_TELEGRAM_BOT_TOKEN: ${TRADEEDGE_TELEGRAM_BOT_TOKEN:?required}
      TRADEEDGE_TELEGRAM_CHAT_ID: ${TRADEEDGE_TELEGRAM_CHAT_ID:?required}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  tradeedge-shadow:
    image: golang:1.23.4-bookworm@sha256:95db116434e3f21a2a15600ffc7169bf380c6bfd021b154d106fcb346721c277
    platform: linux/amd64
    init: true
    restart: "no"
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -eu
        if [ ! -f /workspace/.cache/tradeedge/preparation.env ]; then
          echo "generated SHADOW artifact selectors are unavailable; run tradeedge-prepare" >&2
          exit 1
        fi
        set -a
        . /workspace/.cache/tradeedge/preparation.env
        TRADEEDGE_AUTHORIZATION_MANIFEST="$${TRADEEDGE_AUTHORIZATION_MANIFEST_HOST:-}"
        TRADEEDGE_RUNTIME_BUNDLE="$${TRADEEDGE_RUNTIME_BUNDLE_HOST:-}"
        set +a
        if [ -z "$${TRADEEDGE_AUTHORIZATION_MANIFEST:-}" ]; then
          echo "checksum-bound authorization manifest is unavailable" >&2
          exit 1
        fi
        if [ -z "$${TRADEEDGE_RUNTIME_BUNDLE:-}" ]; then
          echo "checksum-bound SHADOW runtime bundle is unavailable" >&2
          exit 1
        fi
        go build -buildvcs=true -o /tmp/tradeedge ./cmd/tradeedge
        exec /tmp/tradeedge
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${TRADEEDGE_HOST_REPOSITORY:-.}
        target: /workspace
        read_only: true
      - type: bind
        source: ${TRADEEDGE_HOST_REPOSITORY:-.}/.cache/market-validation/shadow-checkpoint
        target: /var/lib/tradeedge/checkpoint
      - type: bind
        source: ${TRADEEDGE_HOST_REPOSITORY:-.}/.cache/tradeedge/session
        target: /var/lib/tradeedge/session
        read_only: true
      - type: tmpfs
        target: /run/tradeedge
        tmpfs:
          mode: 448
    environment:
      TRADEEDGE_ENV: production
      TRADEEDGE_HTTP_ADDR: :8080
      TRADEEDGE_TRADING_MODE: shadow
      TRADEEDGE_ZERODHA_MODE: SHADOW
      TRADEEDGE_ZERODHA_READ_ONLY: "true"
      TRADEEDGE_RUNTIME_BUNDLE: ${TRADEEDGE_RUNTIME_BUNDLE_HOST:-}
      TRADEEDGE_AUTHORIZATION_MANIFEST: ${TRADEEDGE_AUTHORIZATION_MANIFEST_HOST:-}
      TRADEEDGE_CHECKPOINT_ROOT: /var/lib/tradeedge/checkpoint
      TRADEEDGE_OPERATOR_CONTROL_SOCKET: /run/tradeedge/operator.sock
      TRADEEDGE_ZERODHA_API_KEY: ${TRADEEDGE_ZERODHA_API_KEY:?required}
      TRADEEDGE_ZERODHA_API_SECRET: ${TRADEEDGE_ZERODHA_API_SECRET:?required}
      TRADEEDGE_ZERODHA_SESSION_FILE: /var/lib/tradeedge/session/zerodha.json
      TRADEEDGE_TELEGRAM_ENABLED: "true"
      TRADEEDGE_TELEGRAM_BOT_TOKEN: ${TRADEEDGE_TELEGRAM_BOT_TOKEN:?required}
      TRADEEDGE_TELEGRAM_CHAT_ID: ${TRADEEDGE_TELEGRAM_CHAT_ID:?required}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
