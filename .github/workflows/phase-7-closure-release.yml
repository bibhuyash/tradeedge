name: Phase 7 Closure Release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-7-closure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Ordinary verification
        run: |
          test -z "$(gofmt -l .)"
          go test ./... -timeout=15m
          go vet ./...
          go build ./...
      - name: Full race suite
        run: go test -race ./... -count=1 -timeout=20m
      - name: Focused failure, restart, replay, and notification stress
        run: |
          go test -race ./internal/tradingruntime/... ./internal/notification/... ./internal/operations/... ./internal/releasegate/phase7closure -count=10 -timeout=15m
      - name: Phase 1-7 authoritative regressions
        run: |
          go test -race ./internal/marketdata/... ./internal/strategy/... ./internal/risk/... -count=2 -timeout=15m
          go test -race ./internal/execution/... ./internal/integration/zerodha/... ./internal/accounting/... -count=2 -timeout=15m
          go run ./cmd/tradeedge-marketdata loadtest -profile=normal > phase-1.json
          go run ./cmd/tradeedge-strategy-gate > phase-2.json
          go run ./cmd/tradeedge-risk-gate > phase-3.json
          go run ./cmd/tradeedge-execution-gate > phase-4.json
          go run ./cmd/tradeedge-phase5-gate > phase-5.json
          go run ./cmd/tradeedge-phase6-gate > phase-6.json
          go run ./cmd/tradeedge-phase7-gate > phase-7-m1.json
          go run ./cmd/tradeedge-phase7-m2-gate > phase-7-m2.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for number in range(1, 7):
              value = json.loads(Path(f"phase-{number}.json").read_text())
              if value.get("passed") is not True:
                  raise SystemExit(f"Phase {number} gate failed")
          for name in ("phase-7-m1.json", "phase-7-m2.json"):
              if json.loads(Path(name).read_text()).get("passed") is not True:
                  raise SystemExit(f"{name} failed")
          PY
      - name: Accelerated soak and bounded-resource repetitions
        run: go test -race ./internal/marketdata/loadtest ./internal/tradingruntime/... ./internal/notification/... -count=25 -timeout=20m
      - name: Authority and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --include='*.go' --exclude='*_test.go' --exclude='gate.go' '\bLIVE_ENABLED\b' internal cmd
          ! grep -RInE --include='*.go' --exclude='*_test.go' '(getUpdates|setWebhook|/buy|/sell)' internal/notification internal/operations
          ! grep -RInE --include='*.go' '\b(float32|float64)\b' internal/accounting internal/risk internal/portfolio
          ! grep -RInE --include='*.go' '(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|access[_-]?token|api[_-]?secret).*(Info|Debug|Warn|Error|Printf)' internal
          ! grep -RInE --include='*.go' 'internal/adapters/broker/' internal/strategy internal/risk internal/accounting internal/notification internal/operations
          go test ./internal/platform/httpserver ./internal/marketdata/opshttp ./internal/strategy/opshttp ./internal/risk/opshttp ./internal/execution/opshttp ./internal/accounting/valuation/opshttp ./internal/operations/opshttp
      - name: Produce fail-closed closure evidence
        env:
          TRADEEDGE_GATE_ORDINARY: passed
          TRADEEDGE_GATE_RACE: passed
          TRADEEDGE_GATE_STRESS: passed
          TRADEEDGE_GATE_SOAK: passed
          TRADEEDGE_GATE_SECURITY: passed
          TRADEEDGE_GATE_PHASE1: passed
          TRADEEDGE_GATE_PHASE2: passed
          TRADEEDGE_GATE_PHASE3: passed
          TRADEEDGE_GATE_PHASE4: passed
          TRADEEDGE_GATE_PHASE5: passed
          TRADEEDGE_GATE_PHASE6: passed
          TRADEEDGE_GATE_PHASE7_M1: passed
          TRADEEDGE_GATE_PHASE7_M2: passed
          TRADEEDGE_GATE_ARTIFACT_UPLOAD: passed
        run: |
          mkdir -p artifacts
          go run ./cmd/tradeedge-phase7-closure-gate > artifacts/phase-7-closure.json
          python -m json.tool artifacts/phase-7-closure.json >/dev/null
          grep -q '"final_enforcement_result": "PASSED"' artifacts/phase-7-closure.json
          sha256sum artifacts/phase-7-closure.json > artifacts/phase-7-closure.json.sha256
          cp phase-1.json phase-2.json phase-3.json phase-4.json phase-5.json phase-6.json phase-7-m1.json phase-7-m2.json artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: phase-7-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
