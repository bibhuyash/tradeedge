name: Delivery

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package Linux binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...

      - name: Build Linux binaries
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/tradeedge-linux-amd64 ./cmd/tradeedge
          go build -trimpath -o dist/tradeedge-marketdata-linux-amd64 ./cmd/tradeedge-marketdata

      - name: Write checksums and build metadata
        shell: bash
        run: |
          (
            cd dist
            sha256sum tradeedge-linux-amd64 tradeedge-marketdata-linux-amd64 > SHA256SUMS
          )
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "go_version=$(go version)"
          } > dist/BUILD_INFO.txt

      - name: Upload delivery artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tradeedge-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
