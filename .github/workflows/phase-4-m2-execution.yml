name: Phase 4 M2 Execution

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-4-m2-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, test, vet, and build
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          go build ./...
      - name: Full race suite
        run: go test -race ./...
      - name: Repeated execution race stress
        run: go test -race ./internal/execution/coordinator ./internal/execution/reconciliation ./internal/execution/replay ./internal/adapters/broker/paper ./internal/adapters/execution/memory -count=10
      - name: Forbidden capability, secret, dependency, and arithmetic scans
        run: |
          ! grep -RInE --include='*.go' --exclude='*_test.go' 'zerodha|kiteconnect|kite\.Connect|PlaceOrder|live[_-]?order' internal/execution internal/adapters/broker/paper
          ! grep -RInE --include='*.go' --exclude='*_test.go' '\bfloat(32|64)\b' internal/execution internal/adapters/broker/paper internal/adapters/execution/memory
          ! grep -RInEi --include='*.go' 'api[_-]?key|access[_-]?token|client[_-]?secret' internal/execution internal/adapters/broker/paper internal/adapters/execution/memory
          ! grep -RInE --include='*.go' 'github\.com/zerodha|kiteconnect' internal/execution internal/adapters/broker/paper
