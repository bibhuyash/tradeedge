name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files require gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Repeat portfolio risk runner and replay race tests
        run: go test -race ./internal/risk/runner ./internal/risk/replay -count=10

      - name: Repeat position accounting and replay race tests
        run: go test -race ./internal/accounting/engine ./internal/accounting/coordinator ./internal/accounting/valuation ./internal/accounting/valuation/replay ./internal/adapters/accounting/memory -count=10

      - name: Run static analysis
        run: go vet ./...

      - name: Build all commands and packages
        run: go build ./...
