name: Market Validation Enablement M1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enablement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Ordinary verification
        run: |
          test -z "$(gofmt -l .)"
          go test ./... -timeout=15m
          go vet ./...
          go build ./...
      - name: Full Ubuntu race suite
        run: go test -race ./... -count=1 -timeout=25m
      - name: Focused composition, stream, restart and control races
        run: go test -race ./internal/app ./internal/adapters/broker/zerodha ./internal/marketdata/ingest ./internal/platform/checkpointfile ./internal/operations/control ./internal/tradingruntime -count=20 -timeout=20m
      - name: Phase 1-7 and readiness regressions
        run: go test -race ./internal/marketdata/... ./internal/strategy/... ./internal/risk/... ./internal/execution/... ./internal/integration/zerodha/... ./internal/accounting/... ./internal/tradingruntime/... ./internal/marketvalidation -count=2 -timeout=25m
      - name: Authority and security scans
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --include='*.go' --exclude='*_test.go' '\bLIVE_ENABLED\b' cmd internal
          ! grep -RInE --include='*.go' --exclude='*_test.go' '(PlaceOrder|SubmitOrder|ModifyOrder)' internal/app internal/adapters/broker/zerodha
          ! grep -RInE --include='*.go' --exclude='*_test.go' '(getUpdates|setWebhook|/buy|/sell)' internal/notification internal/operations
          ! grep -RInE --include='*.go' --exclude='*_test.go' '\b(float32|float64)\b' internal/accounting internal/risk internal/portfolio
          ! grep -RInE --include='*.go' '(access[_-]?token|api[_-]?secret).*(Info|Debug|Warn|Error|Printf)' internal
          ! grep -RInE --include='*.go' 'internal/adapters/broker/' internal/strategy internal/risk internal/accounting internal/notification internal/operations
      - name: Machine-readable enablement evidence
        env:
          TRADEEDGE_M1_GATE_FORMAT: passed
          TRADEEDGE_M1_GATE_TEST: passed
          TRADEEDGE_M1_GATE_VET: passed
          TRADEEDGE_M1_GATE_BUILD: passed
          TRADEEDGE_M1_GATE_LINT: passed
          TRADEEDGE_M1_GATE_RACE: passed
          TRADEEDGE_M1_GATE_FOCUSED_RACE: passed
          TRADEEDGE_M1_GATE_PHASE_REGRESSION: passed
          TRADEEDGE_M1_GATE_READINESS: passed
          TRADEEDGE_M1_GATE_AUTHORITY_SCANS: passed
        run: |
          mkdir -p artifacts
          go run ./cmd/tradeedge-market-validation-m1-gate > artifacts/market-validation-enablement-m1.json
          grep -q '"passed": true' artifacts/market-validation-enablement-m1.json
          sha256sum artifacts/market-validation-enablement-m1.json > artifacts/market-validation-enablement-m1.json.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: market-validation-enablement-m1-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
